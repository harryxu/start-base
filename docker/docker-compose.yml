services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: start-base-server:latest
    environment:
      - DATABASE_URL=sqlite:////app/data/start_base.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: start-base-web:latest
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
