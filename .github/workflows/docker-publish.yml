name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: harryxu/startbase
  DEMO_IMAGE_NAME: harryxu/startbase-demo

jobs:
  docker:
    name: Build & Push Multi-Arch Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------------
      # 1. Main Image (harryxu/startbase)
      # -------------------------------------------------------------
      - name: Extract metadata (tags, labels) for main image
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
            type=ref,event=tag

      - name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # 2. Demo Image (harryxu/startbase-demo)
      # -------------------------------------------------------------
      - name: Extract metadata (tags, labels) for demo image
        id: meta-demo
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DEMO_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
            type=ref,event=tag

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/demo-site.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-demo.outputs.tags }}
          labels: ${{ steps.meta-demo.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
